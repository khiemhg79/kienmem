# ═══════════════════════════════════════════════════════════════
# Mosquitto MQTT Broker — Smart Office
# Bảo mật: Authentication + TLS (đối phó nguy cơ 4.1.3)
# ═══════════════════════════════════════════════════════════════

# ── Global settings ─────────────────────────────────────────
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

# ── Listener nội bộ (giữa containers trong Docker network) ────
listener 1883 0.0.0.0

# ── Listener TLS cho thiết bị IoT bên ngoài (cổng 8883) ──────
# Mã hóa toàn bộ payload MQTT bằng TLS (đối phó nguy cơ 4.1.2)
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
