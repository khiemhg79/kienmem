                  name: smart-office-config
                  key: MQTT_HOST
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: MQTT_PORT
            - name: INFLUXDB_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: INFLUXDB_URL
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smart-office-secrets
                  key: INFLUXDB_TOKEN
            - name: INFLUXDB_ORG
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: INFLUXDB_ORG
            - name: INFLUXDB_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: INFLUXDB_BUCKET
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: RABBITMQ_URL
            - name: PORT
              value: "3004"
          ports:
            - containerPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: so-monitoring-service
  namespace: smart-office
spec:
  selector:
    app: so-monitoring
  ports:
