      port: 3004
      targetPort: 3004
---
# Notification Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: so-notification
  namespace: smart-office
spec:
  replicas: 1
  selector:
    matchLabels:
      app: so-notification
  template:
    metadata:
      labels:
        app: so-notification
    spec:
      containers:
        - name: notification-service
          image: khiemhg79/so-notification-service:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smart-office-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: RABBITMQ_URL
            - name: PORT
              value: "3005"
          ports:
            - containerPort: 3005
---
apiVersion: v1
kind: Service
metadata:
  name: so-notification-service
  namespace: smart-office
spec:
  selector:
    app: so-notification
  ports:
