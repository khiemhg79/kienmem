---
# -------------------------------------------------------------
# 5. API GATEWAY (Cổng tiếp nhận và Điều phối)
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: so-gateway
  namespace: smart-office
spec:
  replicas: 2
  selector:
    matchLabels:
      app: so-gateway
  template:
    metadata:
      labels:
        app: so-gateway
    spec:
      containers:
        - name: gateway
          image: khiemhg79/so-gateway:latest
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: AUTH_URL
            - name: DEVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: DEVICE_URL
            - name: AUTOMATION_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: AUTOMATION_URL
            - name: MONITORING_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: MONITORING_URL
            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-office-config
                  key: NOTIFICATION_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-office-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 3000
---
# NodePort Service để truy cập từ ngoài Cluster
apiVersion: v1
kind: Service
metadata:
  name: so-gateway-service
  namespace: smart-office
spec:
  type: NodePort
  selector:
    app: so-gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 32000
