name: Smart Office CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Web

jobs:
  # -------------------------------------------------------------
  # Lớp 1: KIỂM TRA CHẤT LƯỢNG (Code Quality & Build Verification)
  # -------------------------------------------------------------
  verify-and-test:
    name: Verify Code and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # Cài đặt và build thử nghiệm Frontend
      - name: Build Frontend React SPA
        run: |
          cd frontend
          npm install
          chmod +x node_modules/.bin/vite
          npm run build --if-present

      # Kiểm tra và cài đặt dependency cho từng Microservice để đảm bảo không lỗi cú pháp/package
      - name: Verify Backend Services
        run: |
          for service in auth-service device-service automation-service notification-service api-gateway; do
            echo "::group::Verifying backend/$service"
            cd $GITHUB_WORKSPACE/backend/$service
            npm install
            echo "Verification successful for $service"
            echo "::endgroup::"
          done

      # Cài đặt và kiểm tra Python Monitoring Service
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Verify Python Monitoring Service
        run: |
          cd backend/monitoring-service
          pip install -r requirements.txt --dry-run || pip install -r requirements.txt

  # -------------------------------------------------------------
  # Lớp 2: ĐÓNG GÓI & PHÁT HÀNH (Dockerize & Publish)
  # -------------------------------------------------------------
  docker-build-and-push:
    name: Build & Push Docker Images
    needs: verify-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      HAS_DOCKER_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: ${{ env.HAS_DOCKER_SECRETS == 'true' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và Push ảnh Docker cho API Gateway
      - name: Build & Push Gateway Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/api-gateway
          push: ${{ env.HAS_DOCKER_SECRETS == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/so-gateway:latest

      # Build và Push ảnh Docker cho Auth Service
      - name: Build & Push Auth Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/auth-service
          push: ${{ env.HAS_DOCKER_SECRETS == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/so-auth-service:latest

      # Build và Push ảnh Docker cho Device Service
      - name: Build & Push Device Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/device-service
          push: ${{ env.HAS_DOCKER_SECRETS == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/so-device-service:latest

      # Build và Push ảnh Docker cho Automation Service
      - name: Build & Push Automation Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/automation-service
          push: ${{ env.HAS_DOCKER_SECRETS == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/so-automation-service:latest

      # Build và Push ảnh Docker cho Monitoring Service
      - name: Build & Push Monitoring Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/monitoring-service
          push: ${{ env.HAS_DOCKER_SECRETS == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/so-monitoring-service:latest

      # Build và Push ảnh Docker cho Notification Service
      - name: Build & Push Notification Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/notification-service
          push: ${{ env.HAS_DOCKER_SECRETS == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/so-notification-service:latest
